databases:
  - name: tabletime-db-dev
    databaseName: tabletime_dev
    user: tabletime_dev
    plan: basic-256mb
    region: singapore
  - name: tabletime-db-uat
    databaseName: tabletime_uat
    user: tabletime_uat
    plan: basic-256mb
    region: singapore
  - name: tabletime-db-prod
    databaseName: tabletime_prod
    user: tabletime_prod
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: tabletime-api-dev
    runtime: node
    rootDir: backend
    branch: dev
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: development
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: DATABASE_URL
        fromDatabase:
          name: tabletime-db-dev
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: tabletime-api-uat
    runtime: node
    rootDir: backend
    branch: uat
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: uat
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: DATABASE_URL
        fromDatabase:
          name: tabletime-db-uat
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: tabletime-api-prod
    runtime: node
    rootDir: backend
    branch: main
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: DATABASE_URL
        fromDatabase:
          name: tabletime-db-prod
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
